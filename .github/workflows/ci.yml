name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Pack and smoke-test the npm package
        working-directory: packages/cli
        run: |
          npm pack
          npm install -g ./srusan-sirus-*.tgz
          sirus --version
          sirus --help > /dev/null
