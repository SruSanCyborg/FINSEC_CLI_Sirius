name: Release to npm

# Push a tag like v0.4.1 (matching packages/cli/package.json) to publish @srusan/sirus.
# Uses npm trusted publishing: npmjs.com trusts this repo's workflow, so no token is stored anywhere.
# One-time setup on npmjs.com: package @srusan/sirus -> Settings -> Trusted publisher -> GitHub Actions,
# repository SruSanCyborg/FINSEC_CLI_Sirus, workflow release.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write     # trusted publishing + provenance: proves the package was built from this repo

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest    # trusted publishing needs npm 11.5+
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Check the tag matches the package version
        working-directory: packages/cli
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish
        working-directory: packages/cli
        run: npm publish --provenance --access public
